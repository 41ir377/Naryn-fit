<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استودیو برنامه مربی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#080a0f;--s1:#0e1118;--s2:#141824;--s3:#1b2030;--ln:rgba(255,255,255,.07);--ln2:rgba(255,255,255,.13);--tx:#e9ecf3;--mut:#9097ab;--faint:#5f677c;--ac:#7c8cff;--act:color-mix(in srgb,var(--ac) 62%,#fff);--soft:color-mix(in srgb,var(--ac) 16%,transparent);--ring:color-mix(in srgb,var(--ac) 60%,transparent);--on:#0a0c14;--ok:#3dd68c;--or:#fbbf24;--bad:#fb7185;--c2:#2dd4bf;--c5:#a78bfa;--r:12px;--rl:16px;--ease:cubic-bezier(.22,1,.36,1);--sb:252px;--pad:clamp(16px,2.4vw,32px);--gap:16px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:radial-gradient(900px 520px at 88% -8%,color-mix(in srgb,var(--ac) 13%,transparent),transparent 62%),radial-gradient(700px 420px at 0% 0%,rgba(45,212,191,.05),transparent 60%),var(--bg);background-attachment:fixed;color:var(--tx);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
svg.i{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:6px}
::selection{background:var(--soft)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--s3);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px)}
.aurora i:nth-child(1){width:46vmax;height:46vmax;right:-12vmax;top:-20vmax;background:var(--ac);opacity:.2;animation:d1 26s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:36vmax;height:36vmax;left:-10vmax;top:8vmax;background:var(--c2);opacity:.1;animation:d2 32s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:34vmax;height:34vmax;right:28vmax;bottom:-24vmax;background:var(--c5);opacity:.12;animation:d3 38s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(-20vmax,12vmax) scale(1.25)}}@keyframes d2{to{transform:translate(18vmax,16vmax) scale(.85)}}@keyframes d3{to{transform:translate(16vmax,-10vmax) scale(1.2)}}
.cursor-glow{position:fixed;left:0;top:0;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;z-index:-1;pointer-events:none;opacity:0;transition:opacity .5s;background:radial-gradient(circle,color-mix(in srgb,var(--ac) 18%,transparent),transparent 65%)}.cursor-glow.on{opacity:1}
#intro{position:fixed;inset:0;z-index:300;display:grid;place-items:center;cursor:pointer}
#intro .curt{position:absolute;inset-inline:0;height:50.3%;background:#06070b;transition:transform .95s cubic-bezier(.77,0,.18,1) .1s}
#intro .curt.top{top:0}#intro .curt.bot{bottom:0}
#intro.open .curt.top{transform:translateY(-101%)}#intro.open .curt.bot{transform:translateY(101%)}
#intro .ic{position:relative;display:grid;justify-items:center;gap:14px;transition:opacity .35s,transform .7s var(--ease);animation:rise .7s var(--ease) both}
#intro.open .ic{opacity:0;transform:scale(1.18)}
#intro svg{width:76px;height:76px;filter:drop-shadow(0 8px 24px var(--ac))}#intro b{font-size:18px}
/* shell */
.app{display:grid;grid-template-columns:var(--sb) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .45s var(--ease)}
.app.col{--sb:78px}
.sidebar{position:sticky;top:0;height:100vh;height:100dvh;z-index:40;display:flex;flex-direction:column;padding:16px 14px;border-inline-end:1px solid var(--ln);background:linear-gradient(180deg,var(--s1),var(--bg));overflow-x:hidden;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;height:44px;padding:0 6px;margin-bottom:18px;font-weight:800;font-size:16px}

.brand img{height:32px;max-width:44px;object-fit:contain}
.lbl{white-space:nowrap;overflow:hidden;max-width:170px;transition:max-width .4s var(--ease),opacity .2s}
.col .lbl{max-width:0;opacity:0}
.nt{font-size:11px;color:var(--faint);padding:0 12px;margin:6px 0 8px;white-space:nowrap;overflow:hidden;transition:opacity .2s}.col .nt{opacity:0}
.nav{position:relative}
#navItems{display:flex;flex-direction:column;gap:4px}
.nind{position:absolute;inset-inline:0;top:0;height:42px;border-radius:10px;background:var(--soft);border:1px solid color-mix(in srgb,var(--ac) 28%,transparent);transition:transform .5s var(--ease),height .35s var(--ease),opacity .2s;pointer-events:none}
.nind::before{content:"";position:absolute;inset-inline-end:-15px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--ac);box-shadow:0 0 14px var(--ac)}
.ni{position:relative;z-index:1;display:flex;align-items:center;gap:12px;height:42px;width:100%;padding:0 13px;border-radius:10px;color:var(--mut);font-weight:600;text-align:start;transition:color .2s,background .2s}
.ni:hover{color:var(--tx);background:rgba(255,255,255,.035)}.ni.on{color:var(--tx)}.ni.on>svg.i:first-child{color:var(--act)}

.chv{transition:transform .3s var(--ease)}[aria-expanded=true] .chv{transform:rotate(180deg)}
.col .nb,.col .chv{display:none}
.col .ni::after{content:attr(data-label);position:absolute;inset-inline-start:calc(100% + 14px);top:50%;transform:translate(6px,-50%);background:var(--s3);border:1px solid var(--ln2);padding:5px 10px;border-radius:8px;font-size:12.5px;color:var(--tx);opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .15s,transform .2s var(--ease);box-shadow:0 10px 24px rgba(0,0,0,.45)}
.col .ni:hover::after{opacity:1;transform:translate(0,-50%)}
.subl{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}.subl.open{grid-template-rows:1fr}.col .subl{display:none}
.subl>div{overflow:hidden;min-height:0;padding-inline-start:12px;border-inline-start:1px dashed var(--ln2);margin-inline-start:22px}
.lst{max-height:280px;overflow-y:auto;padding-top:4px}
.si{display:flex;align-items:center;gap:10px;width:100%;padding:7px 9px;border-radius:10px;color:var(--mut);text-align:start;transition:background .2s,color .2s,transform .25s var(--ease)}
.si:hover{background:rgba(255,255,255,.045);color:var(--tx);transform:translateX(-3px)}.si.on{background:var(--soft);color:var(--tx)}
.si span:last-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si.add{color:var(--act);font-weight:700;margin:4px 0 6px}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--c2));display:grid;place-items:center;font-weight:800;color:var(--on);flex:none}
.av.s{width:26px;height:26px;font-size:11px}
.sbf{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:12px}
.cbtn{display:flex;align-items:center;gap:12px;height:38px;padding:0 13px;border-radius:10px;color:var(--mut);transition:color .2s,background .2s}.cbtn:hover{color:var(--tx);background:rgba(255,255,255,.04)}
.cbtn .i{transition:transform .45s var(--ease)}.col .cbtn .i{transform:rotate(180deg)}
.sbc{display:flex;align-items:center;gap:11px;padding:10px;border-radius:12px;background:var(--s2);border:1px solid var(--ln)}
.sbc small{display:block;color:var(--mut);font-size:12px;line-height:1.2}.sbc b{display:block;font-size:13px}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(3,5,9,.62);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.shell{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;gap:14px;padding:0 var(--pad);background:color-mix(in srgb,var(--bg) 74%,transparent);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--ln)}
.ibtn{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;color:var(--mut);transition:.2s var(--ease)}.ibtn:hover{color:var(--tx);background:var(--s2)}.ibtn:active{transform:scale(.92)}
#bm{display:none}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--faint);white-space:nowrap;overflow:hidden}.crumbs b{color:var(--tx);font-weight:700}
.sp{flex:1}
.live{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:99px;background:var(--s1);border:1px solid var(--ln);color:var(--mut);font-size:12.5px}
.dotl{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:ping 2s infinite}@keyframes ping{0%{box-shadow:0 0 0 0 rgba(61,214,140,.6)}70%,100%{box-shadow:0 0 0 7px transparent}}
#view{padding:var(--pad);width:100%;max-width:1520px;margin:0 auto;flex:1;min-width:0}
#view.enter>*{animation:rise .7s var(--ease) both}
#view.enter>*:nth-child(2){animation-delay:.06s}#view.enter>*:nth-child(3){animation-delay:.12s}#view.enter>*:nth-child(4){animation-delay:.18s}#view.enter>*:nth-child(5){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}}@keyframes pop{from{opacity:0;transform:scale(.4)}}@keyframes fade{from{opacity:0}}@keyframes grow{from{transform:scaleY(0)}}@keyframes sx{from{transform:scaleX(0)}}@keyframes dr{to{stroke-dashoffset:0}}@keyframes arc{from{stroke-dasharray:0 327}}
h1{font-size:clamp(22px,2.7vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.25;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 16px}
/* primitives */
.card{position:relative;isolation:isolate;background:linear-gradient(180deg,color-mix(in srgb,var(--s2) 70%,var(--s1)),var(--s1));border:1px solid var(--ln);border-radius:var(--rl);padding:20px;margin-bottom:var(--gap);box-shadow:0 1px 0 rgba(255,255,255,.035) inset,0 14px 34px -18px rgba(0,0,0,.7);transition:border-color .3s,transform .4s var(--ease)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(300px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--ac) 11%,transparent),transparent 70%)}
.card:hover{border-color:var(--ln2)}.card:hover::before{opacity:1}
.card h3{margin:0 0 14px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}.card h3 .i{color:var(--act)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap)}.grid>.card{margin:0}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.mb16{margin-bottom:var(--gap)}
label{display:block;font-size:12px;color:var(--mut);font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--ln2);border-radius:10px;background:var(--s2);color:var(--tx);margin-top:4px;transition:border-color .2s,box-shadow .25s,background .2s}
input:hover,select:hover,textarea:hover{border-color:rgba(255,255,255,.2)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ring);box-shadow:0 0 0 4px var(--soft);background:var(--s3)}
input[type=color]{padding:2px;height:40px}option,optgroup{background:var(--s1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:10px;background:var(--ac);color:var(--on);border:1px solid transparent;font-weight:700;font-size:13px;white-space:nowrap;box-shadow:0 8px 22px -8px var(--ac);transition:transform .2s var(--ease),background .2s,box-shadow .25s,border-color .2s}
.btn:hover{background:color-mix(in srgb,var(--ac) 86%,#fff);transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.o{background:var(--s2);color:var(--tx);border-color:var(--ln2);box-shadow:none}.btn.o:hover{background:var(--s3)}
.btn.w{background:var(--or);color:#1a1203;box-shadow:0 8px 22px -10px var(--or)}
.btn.r{background:transparent;color:#ff9aa8;border-color:rgba(251,113,133,.35);box-shadow:none}.btn.r:hover{background:rgba(251,113,133,.1)}
.btn.s{height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.row>input,.row>select{margin-top:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:600;background:var(--s3);color:var(--mut)}.chip b{color:var(--tx)}
.chp{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700}.chp.good{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}.chp.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}.chp .i{width:12px;height:12px;stroke-width:2.4}
.seg{display:flex;gap:3px;padding:4px;border-radius:13px;background:var(--s1);border:1px solid var(--ln);margin:14px 0 var(--gap);overflow-x:auto}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:9px;color:var(--mut);font-weight:600;white-space:nowrap;transition:.25s var(--ease)}
.seg button:hover{color:var(--tx);background:var(--s2)}.seg button.on{background:var(--s3);color:var(--tx);box-shadow:0 4px 12px rgba(0,0,0,.35),inset 0 0 0 1px var(--ln2)}.seg button.on .i{color:var(--act)}
.hero{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.hero .av{width:54px;height:54px;font-size:20px}
.stat{background:var(--s2);border:1px solid var(--ln);border-radius:12px;padding:12px;text-align:center;transition:transform .3s var(--ease),border-color .2s}.stat:hover{transform:translateY(-3px);border-color:var(--ln2)}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}.stat span{font-size:12px;color:var(--mut)}
.bar{height:9px;background:var(--s3);border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 55%,transparent),var(--ac));border-radius:6px;transition:width .8s var(--ease)}.bar i.over{background:var(--or)}
.ots{display:flex;gap:6px;margin-bottom:12px}.ot{flex:1;border:1px solid var(--ln);background:var(--s2);border-radius:12px;padding:7px 4px;text-align:center;transition:.25s var(--ease)}

.line{display:grid;grid-template-columns:2fr 90px 90px 36px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--ln2);animation:rise .35s var(--ease)}.line input{margin:0}
.wl{display:grid;grid-template-columns:2fr 64px 84px 84px 1.5fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--ln2);animation:rise .35s var(--ease)}.wl input,.wl select{margin:0}.wh{color:var(--mut);font-size:12px;border:0}

.paper{background:#cfd6de;border-radius:var(--rl);padding:clamp(8px,2vw,22px);margin-top:14px}.paper .doc{box-shadow:0 10px 40px #0004;border-radius:8px}
.ai{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:10px;text-align:start;transition:.2s var(--ease)}.ai:hover{background:rgba(255,255,255,.045);transform:translateX(-3px)}.ai small{display:block;color:var(--mut)}
/* dashboard */
.hb{position:relative;border-radius:20px;padding:24px clamp(16px,3vw,30px);margin-bottom:var(--gap);background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 40%,var(--s1)),var(--s1) 72%);border:1px solid var(--ln);overflow:hidden}
.hb::after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;inset-inline-end:-70px;top:-120px;background:radial-gradient(color-mix(in srgb,var(--c2) 40%,transparent),transparent 70%);animation:fl 7s ease-in-out infinite alternate;pointer-events:none}@keyframes fl{to{transform:translate(30px,26px) scale(1.15)}}
.hb>*{position:relative;z-index:1}
.srch{position:relative;max-width:480px;margin-top:14px}.srch .i{position:absolute;inset-inline-start:14px;top:13px;color:var(--mut)}.srch input{margin:0;padding:11px 14px;padding-inline-start:44px;border-radius:12px;background:rgba(8,10,15,.7)}
#dsr{max-width:480px;margin-top:8px;background:var(--s1);border:1px solid var(--ln2);border-radius:12px;padding:6px;animation:rise .25s var(--ease)}#dsr:empty{display:none}
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap);margin-bottom:var(--gap)}.kp .card{margin:0}.k:hover{transform:translateY(-3px)}
.kt{display:flex;align-items:center;gap:10px}.ki{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--kc);background:color-mix(in srgb,var(--kc) 14%,transparent);transition:transform .45s var(--ease)}.k:hover .ki{transform:rotate(-8deg) scale(1.1)}
.kl{color:var(--mut);font-weight:600;flex:1}
.km{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:14px;min-height:40px}.kv{font-size:clamp(24px,2.3vw,31px);font-weight:800;letter-spacing:-.03em;line-height:1.1}

.chart{display:flex;align-items:flex-end;gap:12px;height:190px;padding-top:10px}
.cb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:12px;color:var(--mut)}.cb b{color:var(--tx)}
.cb i{display:block;width:100%;max-width:52px;min-height:4px;border-radius:9px 9px 3px 3px;background:color-mix(in srgb,var(--ac) 42%,transparent);transform-origin:bottom;animation:grow .8s var(--ease) both;transition:background .2s}.cb:hover i{background:var(--ac)}
.donut{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center}.donut-box{width:170px;height:170px;flex:none}.donut-box svg{width:100%;height:100%}
.arc{fill:none;stroke-width:16;transition:opacity .25s,stroke-width .25s;cursor:pointer;animation:arc 1.1s var(--ease) both}
.has-act .arc{opacity:.28}.has-act .arc.act{opacity:1;stroke-width:21}
.lg2{flex:1;min-width:150px;display:flex;flex-direction:column;gap:2px}.lg2 div{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;color:var(--mut);font-weight:600;cursor:default;transition:background .2s,transform .25s var(--ease)}.lg2 div:hover{background:rgba(255,255,255,.045);color:var(--tx);transform:translateX(-3px)}.lg2 i{width:9px;height:9px;border-radius:3px}.lg2 b{margin-inline-start:auto;color:var(--tx)}

/* migration: keeps old data, adds exercise categories and meal options A-D */
const OPT=['A','B','C','D'],nm=m=>{if(!m.opts){m.opts=[{items:m.items||[]},{items:[]},{items:[]},{items:[]}];delete m.items}};
function migrate(){const old=S.exs||[];if(!old.length||!old[0].cat){const lib=buildLib(),by=Object.fromEntries(lib.map(x=>[x.n,x.id])),map={},extra=[];old.forEach(o=>by[o.n]?map[o.id]=by[o.n]:extra.push({id:o.id,n:o.n,cat:CATS.includes(o.m)?o.m:'سایر'}));S.exs=lib.concat(extra);const rm=ds=>ds.forEach(d=>d.ex.forEach(x=>{if(map[x.e])x.e=map[x.e]}));S.athletes.forEach(a=>{rm(a.plan.days);a.hist.forEach(h=>rm(h.plan.days))});S.tpl.work.forEach(t=>rm(t.d))}

const GOAL=[[-.2,'کاهش چربی (۲۰٪ کسری)'],[-.1,'کاهش ملایم (۱۰٪ کسری)'],[0,'حفظ وزن'],[.1,'افزایش حجم (۱۰٪ مازاد)'],[.15,'افزایش حجم سریع (۱۵٪)']];
const opts=(arr,sel,lab)=>arr.map(o=>{const v=o.id!==undefined?o.id:o[0];return `<option value="${v}" ${v==sel?'selected':''}>${esc(lab?lab(o):o[1])}</option>`}).join('');
function calc(p){const bmr=10*p.w+6.25*p.h-5*p.age+(p.sex=='m'?5:-161),tdee=bmr*p.act,kcal=r0(tdee*(1+p.goal)),pr=r0(p.pk*p.w),fa=r0(kcal*p.fat/100/9),ch=Math.max(0,r0((kcal-pr*4-fa*9)/4));return{bmr:r0(bmr),tdee:r0(tdee),kcal,pr,fa,ch}}
function tI(items){const t={k:0,p:0,c:0,f:0};items.forEach(i=>{const f=F(i.f);if(!f)return;const x=i.g/100;t.k+=f.k*x;t.p+=f.p*x;t.c+=f.c*x;t.f+=f.f*x});return t}
function dayRange(meals){let lo=0,hi=0;meals.forEach(m=>{const ks=m.opts.filter(o=>o.items.length).map(o=>tI(o.items).k);if(ks.length){lo+=Math.min(...ks);hi+=Math.max(...ks)}});return[lo,hi]}

async function sb(path,o={},t){const r=await fetch(SB_URL+path,{...o,headers:{...sbH(t),...(o.headers||{})}});let j=null;try{j=await r.json()}catch(e){}if(!r.ok)throw Object.assign(new Error((j&&(j.msg||j.error_description||j.message||j.error))||'HTTP '+r.status),{status:r.status});return j}
const setSes=j=>{SES={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),user:j.user};localStorage.setItem(SESK,JSON.stringify(SES))};
async function tok(){if(!SES)throw new Error('وارد نشده‌ای');if(SES.expires_at*1000-Date.now()<60000){const j=await sb('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:SES.refresh_token})});setSes(j)}return SES.access_token}
const fa=m=>({'Invalid login credentials':'ایمیل یا رمز عبور اشتباه است','User already registered':'این ایمیل قبلاً ثبت شده است','Email not confirmed':'ابتدا ایمیل خود را از لینک ارسالی تأیید کن'}[m]||(/at least 6|weak|short/i.test(m)?'رمز عبور باید حداقل ۶ کاراکتر باشد':/rate limit|too many/i.test(m)?'تعداد تلاش‌ها زیاد است؛ کمی بعد دوباره امتحان کن':/fetch|network/i.test(m)?'اتصال اینترنت یا آدرس پروژه را بررسی کن':m));
function showAuth(mode,msg,ok){mode=mode||'in';ui.am=mode;const T={in:'برای ورود، اطلاعات حساب خود را وارد کن',up:'حساب مربی جدید بساز',rec:'ایمیل حساب را بنویس تا لینک بازیابی بفرستیم',new:'رمز عبور جدید را وارد کن'},K=e=>`onkeydown="if(event.key=='Enter')authGo()"`;
$('#modal').innerHTML=`<div class="auth"><div class="card" role="dialog" aria-label="ورود به حساب"><div class="brand"><svg class="lg" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--ac)"/><path d="M6 17h5l3-7 4 13 3-6h5" fill="none" stroke="var(--on)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>استودیو برنامه مربی</span></div><p class="sub">${T[mode]}</p>
${mode=='in'||mode=='up'?`<div class="seg" style="margin:0 0 4px"><button class="${mode=='in'?'on':''}" onclick="showAuth('in')">ورود</button><button class="${mode=='up'?'on':''}" onclick="showAuth('up')">ثبت‌نام</button></div>`:''}
${mode!='new'?`<label>ایمیل<input id="ae" type="email" autocomplete="email" ${K()}></label>`:''}
${mode!='rec'?`<label>رمز عبور<input id="ap" type="password" autocomplete="${mode=='in'?'current-password':'new-password'}" ${K()}></label>`:''}
<div class="err ${ok?'okm':''}" id="aer" role="alert">${esc(msg||'')}</div>
<button class="btn" style="width:100%" id="asb" onclick="authGo()">${{in:'ورود',up:'ساخت حساب',rec:'ارسال لینک بازیابی',new:'ثبت رمز جدید'}[mode]}</button>
<div class="row" style="justify-content:center;margin:14px 0 0">${mode=='in'?`<button class="lk" style="font-weight:600;color:var(--mut)" onclick="showAuth('rec')">رمز را فراموش کرده‌ام</button>`:mode=='rec'||mode=='new'?`<button class="lk" style="font-weight:600;color:var(--mut)" onclick="showAuth('in')">بازگشت به ورود</button>`:''}</div></div></div>`;const i=$('#ae')||$('#ap');i&&i.focus()}
async function authGo(){const m=ui.am||'in',e=(($('#ae')||{}).value||'').trim(),p=($('#ap')||{}).value||'',b=$('#asb'),say=(t,ok)=>{$('#aer').className='err'+(ok?' okm':'');$('#aer').textContent=t};
if(m!='new'&&!/^\S+@\S+\.\S+$/.test(e))return say('ایمیل را درست وارد کن');if(m!='rec'&&p.length<6)return say('رمز عبور باید حداقل ۶ کاراکتر باشد');
b.disabled=true;say('');
try{if(m=='in'){setSes(await sb('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:e,password:p})}));location.reload()}
else if(m=='up'){const j=await sb('/auth/v1/signup',{method:'POST',body:JSON.stringify({email:e,password:p})});if(j&&j.access_token){setSes(j);location.reload()}else say('لینک تأیید به ایمیلت ارسال شد. بعد از تأیید، وارد شو.',true)}
else if(m=='rec'){await sb('/auth/v1/recover',{method:'POST',body:JSON.stringify({email:e})});say('اگر این ایمیل ثبت شده باشد، لینک بازیابی ارسال شد.',true)}
else{await sb('/auth/v1/user',{method:'PUT',body:JSON.stringify({password:p})},ui.rtok);say('رمز عوض شد. حالا وارد شو.',true);setTimeout(()=>showAuth('in'),1200)}}
catch(x){say(fa(x.message))}finally{b.disabled=false}}
async function handleHash(){const h=location.hash.slice(1);if(!CLOUD||!/access_token=/.test(h))return false;const p=new URLSearchParams(h),at=p.get('access_token'),rt=p.get('refresh_token'),ty=p.get('type');history.replaceState(null,'',location.pathname+location.search);
if(ty=='recovery'){ui.rtok=at;showAuth('new');return true}
try{const u=await sb('/auth/v1/user',{},at);setSes({access_token:at,refresh_token:rt,expires_in:+p.get('expires_in')||3600,user:u});location.reload()}catch(e){showAuth('in','لینک نامعتبر یا منقضی شده است')}return true}
/* همگام‌سازی */
let SM={rev:null,dirty:false},pushT=null;try{SM=JSON.parse(localStorage.getItem('coach_sync_'+(SES&&SES.user?SES.user.id:''))||'null')||SM}catch(e){}
const saveSM=()=>{try{localStorage.setItem('coach_sync_'+SES.user.id,JSON.stringify(SM))}catch(e){}};
const chip=()=>{const st=ui.cs||'saved',T={saved:'ذخیره ابری',saving:'در حال ذخیره…',dirty:'ذخیره‌نشده',error:'خطا؛ تلاش مجدد'};return `<button class="cch ${st}" onclick="cloudSave()" title="${esc(ui.cm||'همگام‌سازی با حساب ابری')}"><i></i><span>${T[st]}</span></button>`};
function setCS(st,m){ui.cs=st;ui.cm=m||'';const w=$('#cchw');if(w)w.innerHTML=chip()}
function schedulePush(){if(!CLOUD||!SES)return;ui.ver=(ui.ver||0)+1;SM.dirty=true;saveSM();setCS('dirty');clearTimeout(pushT);pushT=setTimeout(()=>cloudSave(),1500)}
async function pull(){const r=await sb('/rest/v1/workspaces?select=data,updated_at&user_id=eq.'+SES.user.id,{},await tok());return r&&r[0]||null}
function applyRemote(r){S=r.data;migrate();mem=JSON.stringify(S);try{localStorage.setItem(KEY,mem)}catch(e){}SM={rev:r.updated_at,dirty:false};saveSM();render();setCS('saved')}
async function resolveConflict(){const r=await pull();if(!r){SM.rev=null;saveSM();ui.busy=false;return cloudSave()}
if(confirm('اطلاعات این حساب روی دستگاه یا تب دیگری تغییر کرده است.\n\nتأیید = بارگذاری نسخه ابری (تغییرات اخیر همین صفحه از بین می‌رود)\nانصراف = نگه‌داشتن نسخه همین صفحه و بازنویسی ابر'))applyRemote(r);else{SM.rev=r.updated_at;saveSM();ui.busy=false;await cloudSave()}}
async function cloudSave(){if(!CLOUD||!SES)return;if(ui.busy)return;ui.busy=true;clearTimeout(pushT);setCS('saving');const v=ui.ver;
try{const t=await tok(),ts=new Date().toISOString();let row;
if(SM.rev){const r=await sb('/rest/v1/workspaces?user_id=eq.'+SES.user.id+'&updated_at=eq.'+encodeURIComponent(SM.rev),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({data:S,updated_at:ts})},t);row=r&&r[0];if(!row){await resolveConflict();return}}
else{try{const r=await sb('/rest/v1/workspaces',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({user_id:SES.user.id,data:S,updated_at:ts})},t);row=r[0]}catch(e){if(e.status==409){await resolveConflict();return}throw e}}
SM={rev:row.updated_at,dirty:ui.ver!==v};saveSM();setCS(SM.dirty?'dirty':'saved');if(SM.dirty)pushT=setTimeout(()=>cloudSave(),300)}
catch(e){setCS('error',fa(e.message))}finally{ui.busy=false}}
async function bootSync(){if(!CLOUD||!SES)return;try{setCS('saving');const r=await pull(),ok=r&&r.data&&Array.isArray(r.data.athletes);
if(!ok){if(!S.athletes.length){const lg=localStorage.getItem('coach_planner_v1');try{const d=lg&&JSON.parse(lg);if(d&&d.athletes&&d.athletes.length&&confirm('اطلاعات ذخیره‌شده قبلی روی این دستگاه پیدا شد. به این حساب منتقل شود؟')){S=d;migrate();render()}}catch(e){}}SM.rev=r?r.updated_at:null;await cloudSave();return}
if(SM.rev===r.updated_at){if(SM.dirty)await cloudSave();else setCS('saved');return}
if(SM.dirty&&SM.rev&&!confirm('روی این دستگاه تغییراتی ذخیره‌نشده است و نسخه ابری هم عوض شده.\n\nتأیید = بارگذاری نسخه ابری\nانصراف = نگه‌داشتن نسخه این دستگاه و بازنویسی ابر')){SM.rev=r.updated_at;saveSM();await cloudSave();return}
applyRemote(r)}catch(e){setCS('error',fa(e.message))}}
function accMenu(e){e.stopPropagation();ui.acc=!ui.acc;ui.sv=false;redrawTop()}
function accBtn(){const ini=esc(initials(S.coach.name||(SES&&SES.user&&SES.user.email)||'مربی'));if(!CLOUD||!SES)return `<div class="av s" aria-hidden="true">${ini}</div>`;return `<div class="accw"><button class="av s" onclick="accMenu(event)" aria-haspopup="menu" aria-expanded="${!!ui.acc}" aria-label="حساب کاربری">${ini}</button>${ui.acc?`<div class="svm" role="menu"><div class="svh"><b>${esc(SES.user.email||'')}</b><small>حساب مربی</small></div><button class="si" role="menuitem" onclick="logout()">${ic('x')}<span>خروج از حساب</span></button></div>`:''}</div>`}
async function logout(){if(SM.dirty){await cloudSave();if(SM.dirty&&!confirm('بعضی تغییرات هنوز در ابر ذخیره نشده‌اند و با خروج از بین می‌روند. خروج انجام شود؟'))return}
try{await sb('/auth/v1/logout',{method:'POST'},await tok())}catch(e){}const id=SES.user.id;SM.dirty=false;localStorage.removeItem(SESK);localStorage.removeItem('coach_planner_u_'+id);localStorage.removeItem('coach_sync_'+id);location.reload()}
document.addEventListener('click',e=>{if(ui.acc&&!e.target.closest('.accw')){ui.acc=false;redrawTop()}});
addEventListener('online',()=>{if(SM.dirty)cloudSave()});
addEventListener('beforeunload',e=>{if(CLOUD&&SES&&SM.dirty){e.preventDefault();e.returnValue=''}});
const lum=h=>{const m=/^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i.exec(h||'');if(!m)return 0;const c=[1,2,3].map(i=>{const v=parseInt(m[i],16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const clock=()=>new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
function navItems(){const v=S.view,N=(id,i,l,on)=>{on=on===undefined?v==id:on;return `<button class="ni ${on?'on':''}" data-label="${l}" onclick="go('${id}')" ${on?'aria-current="page"':''}>${ic(i)}<span class="lbl">${l}</span></button>`};
return N('dash','home','داشبورد')+N('list','grid','لیست ورزشکاران',v=='list'||v=='build')+N('search','search','جستجو')+N('lib','book','کتابخانه')+N('set','cog','برند و پشتیبان')}
function topbar(){const a=A(),v=S.view,T={dash:'داشبورد',lib:'کتابخانه',set:'برند و پشتیبان',build:'لیست ورزشکاران',list:'لیست ورزشکاران',search:'جستجو'};
return `<button class="ibtn" id="bm" onclick="drawer(true)" aria-label="باز کردن منو">${ic('menu')}</button><nav class="crumbs" aria-label="مسیر"><span>${esc(S.coach.name)||'استودیو مربی'}</span><span aria-hidden="true">/</span>${v=='build'?`<button class="lk" style="font-weight:700;color:var(--tx)" onclick="go('list')">${T[v]}</button>`:`<b>${T[v]}</b>`}${v=='build'&&a?`<span aria-hidden="true">/</span><b>${esc(a.n)}</b>`:''}</nav><div class="sp"></div>${CLOUD&&SES?'<span id="cchw">'+chip()+'</span>':''}${svBtn()}<div class="live" title="ساعت محلی"><span class="dotl"></span><span id="clk">${clock()}</span></div>${accBtn()}`}
function render(){const y=scrollY,c=S.coach,R=document.documentElement.style;R.setProperty('--ac',c.color);R.setProperty('--on',lum(c.color)>.5?'#0a0c14':'#fff');
$('#app').className='app'+(S.col?' col':'')+(ui.drawer?' nav-open':'');
$('#sbBrand').innerHTML=(c.logo?`<img src="${c.logo}" alt="">`:`<svg class="lg" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--ac)"/><path d="M6 17h5l3-7 4 13 3-6h5" fill="none" stroke="var(--on)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`)+`<span class="lbl">${esc(c.name)||'استودیو مربی'}</span>`;
$('#navItems').innerHTML=navItems();
$('#sbFoot').innerHTML=`<button class="cbtn" onclick="collapse()" aria-label="جمع‌کردن منو">${ic('back')}<span class="lbl">جمع‌کردن منو</span></button><div class="sbc"><span class="av s">${esc(initials(c.name||'مربی'))}</span><div class="lbl"><b>${esc(c.name)||'مربی'}</b><small>${S.athletes.length} ورزشکار</small></div></div>`;
$('#top').innerHTML=topbar();
const a=A(),v=S.view;let h=v=='dash'?vDash():v=='list'?vList():v=='search'?vSearch():v=='lib'?vLib():v=='set'?vSet():a?vBuild(a):`<div class="card empty">${ic('users')}<p>یک ورزشکار را از «لیست ورزشکاران» انتخاب کن یا پروفایل جدید بساز.</p><div class="row"><button class="btn o" onclick="go('list')">${ic('grid')}لیست ورزشکاران</button><button class="btn" onclick="newAth()">${ic('plus')}ورزشکار جدید</button></div></div>`;
const V=$('#view');V.className=ANIM?'enter':'';V.innerHTML=h;if(v=='search'){drawSearch();if(ANIM){const q=$('#sq');q&&q.focus()}}
if(ANIM&&v=='dash')document.querySelectorAll('.kv[data-n]').forEach(e=>{const n=+e.dataset.n,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/900);e.textContent=r0(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)});
ANIM=false;posInd();scrollTo(0,y)}
/* fx: tooltip, glow, intro, clock */
document.addEventListener('pointermove',e=>{const t=$('#tip'),g=$('#cg'),el=e.target.closest?e.target.closest('[data-tip]'):null;
if(g&&e.pointerType=='mouse'){g.style.transform=`translate(${e.clientX}px,${e.clientY}px)`;g.classList.add('on')}
const c=e.target.closest?e.target.closest('.card'):null;if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',e.clientX-r.left+'px');c.style.setProperty('--my',e.clientY-r.top+'px')}
if(el){t.textContent=el.dataset.tip;t.classList.add('on');const w=t.offsetWidth;t.style.transform=`translate(${Math.max(8,Math.min(innerWidth-w-8,e.clientX-w/2))}px,${e.clientY-46}px)`}else t.classList.remove('on')});
document.addEventListener('mouseover',e=>{const g=e.target.closest?e.target.closest('[data-g]'):null,b=$('.donut-box');document.querySelectorAll('.arc').forEach(x=>x.classList.toggle('act',!!g&&x.dataset.g==g.dataset.g));if(b)b.classList.toggle('has-act',!!g)});
setInterval(()=>{const c=$('#clk');if(c)c.textContent=clock()},20000);
addEventListener('resize',posInd);addEventListener('load',posInd);
function introOff(){const i=$('#intro');if(!i)return;i.classList.add('open');setTimeout(()=>i.remove(),1100)}
{const i=$('#intro'),r=matchMedia('(prefers-reduced-motion:reduce)').matches;$('#intN').textContent=S.coach.name||'استودیو برنامه مربی';if(r)i.remove();else{i.addEventListener('click',introOff);document.addEventListener('keydown',introOff,{once:true});setTimeout(introOff,1300)}}
if(CLOUD&&!SES){handleHash().then(h=>{if(!h)showAuth()})}else{render();bootSync()}
</script>
